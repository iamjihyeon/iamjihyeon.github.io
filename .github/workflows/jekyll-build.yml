name: Jekyll build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check primary pages
        run: |
          for page in index.html research/index.html publications/index.html experience/index.html cv/index.html; do
            test -s "_site/$page"
          done
          for section in about research-interests publications experience; do
            grep -q "id=\"$section\"" _site/index.html
          done
          test "$(find _site/publications -mindepth 2 -name index.html | wc -l)" -eq 5
